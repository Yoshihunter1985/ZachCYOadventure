<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zach and the Stolen Hour</title>
<meta name="theme-color" content="#1d1830">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="title" class="screen">
    <div class="bg"></div>
    <svg class="title-clock" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="92" fill="#fbf1df" stroke="#e3a72f" stroke-width="10"/>
      <g fill="#5b2a86"><circle cx="100" cy="24" r="6"/><circle cx="176" cy="100" r="6"/><circle cx="100" cy="176" r="6"/><circle cx="24" cy="100" r="6"/></g>
      <rect class="hand" x="96" y="44" width="8" height="60" rx="4" fill="#2b2622"/>
      <rect class="hand min" x="97.5" y="30" width="5" height="74" rx="2.5" fill="#c4472f"/>
      <circle cx="100" cy="100" r="9" fill="#e3a72f"/>
    </svg>
    <h1>Zach <span>and the</span> Stolen Hour</h1>
    <div class="title-buttons" id="titleButtons"></div>
  </section>

  <section id="book" class="screen" hidden>
    <div class="pic" id="pic"></div>
    <div class="paper">
      <div class="torn" aria-hidden="true"></div>
      <div class="bar">
        <button class="icon-btn" id="homeBtn" aria-label="Home"></button>
        <button class="icon-btn" id="readBtn" aria-label="Read this page to me"></button>
        <span class="chap" id="chapLabel"></span>
        <button class="icon-btn gearcount" id="gearBtn" aria-label="Golden Gears and badges"></button>
      </div>
      <div class="words" id="words"></div>
      <div class="choices" id="choices"></div>
    </div>
  </section>

  <section id="shelf" class="screen" hidden></section>
  <section id="chapterEnd" class="screen" hidden></section>
</div>

<script src="story/world.js"></script>
<script src="story/chapter1.js"></script>
<script src="story/chapter2.js"></script>
<script src="js/game.js"></script>
</body>
</html>
